name: Release

on:
#  workflow_dispatch:
#    inputs:
#      test_build:
#        description: 'Create test builds'
#        type: boolean
#        required: true
#        default: false
        
  push:
    branches:
      - master
  #   paths-ignore:
  #     - '**.md'

env:
  REGISTRY_IMAGE: ghcr.io/pierredurrr/test

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release 

jobs:
#  get-next-version:
#    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' 
#    uses: semantic-release-action/next-release-version/.github/workflows/next-release-version.yml@v4

  # test:
  #   name: Test
  #   runs-on: ubuntu-20.04
  #   continue-on-error: false
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v3
  #     - name: Install Rust
  #       uses: dtolnay/rust-toolchain@stable
  #     - name: Run Tests
  #       run: make run-tests
  #       shell: bash

  build-docker-images:
    runs-on: ubuntu-latest
    needs:
      - build
      - get-next-version
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      -
        name: Download bin
        uses: actions/download-artifact@v3
        with:
          name: bin
          path: bin/
      - name: check bin path
        run: ls -al bin
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.get-next-version.outputs.new-release-version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PERSONAL_TOKEN }}
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: setup qemu
        uses: docker/setup-qemu-action@v2
      - uses: docker/build-push-action@v4
        with:
          push: true
          # push: ${{ github.event_name != 'pull_request' }}
          context: .
          platforms: linux/amd64,linux/arm64
          # file: ./.github/workflows/Dockerfile.ci
          file: docker/Dockerfile.github
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=gha,mode=max
          cache-from: type=gha

  release:
    if: ${{ !inputs.test_build }}
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      -
        name: Download bin
        uses: actions/download-artifact@v3
        with:
          name: bin
          path: bin/
      - name: Package as archive
        shell: bash
        run: |
          mkdir -p assets
          cd bin
          for dir in */; do
              (
                  cd $dir
                  name=${dir%/}
                  if [[ "$name" == *"windows"* ]]; then
                      7z a ../../assets/$name.7z ./
                  else
                      chmod +x ./replex
                      tar czvf ../../assets/$name.tar.gz ./
                  fi
              )
          done
          cd -
      - name: Invoke semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: npx semantic-release@22
   
